services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inva
      POSTGRES_PASSWORD: inva
      POSTGRES_DB: inva
    ports:
      - "55434:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inva -d inva"]
      interval: 2s
      timeout: 3s
      retries: 40
    shm_size: 256mb

  gateway:
    build: ./gateway
    ports:
      - "58103:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 2s
      timeout: 3s
      retries: 40

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://inva:inva@db:5432/inva
      GATEWAY_URL: http://gateway:8000
    ports:
      - "58102:8000"
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  pgdata:
